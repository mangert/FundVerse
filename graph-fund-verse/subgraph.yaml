specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql

dataSources:
  - kind: ethereum/contract
    name: Platform
    network: sepolia
    source:
      address: "0xb996c2cB98A450d5b8E3A70C812427E2dBA73ee7"
      abi: Platform
      startBlock: 9461244
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - FVCampaignCreated
        - FVNewTokenAdded
        - FVTokenRemoved
      abis:
        - name: Platform
          file: ./abis/Platform.json
      eventHandlers:
        - event: FVCampaignCreated(indexed address,indexed address,indexed address,uint256)
          handler: handleCampaignCreated
        - event: FVNewTokenAdded(indexed address)
          handler: handleTokenAdded
        - event: FVTokenRemoved(indexed address)
          handler: handleTokenRemoved
      file: ./src/mapping.ts

templates:
  - kind: ethereum/contract
    name: Campaign
    network: sepolia
    source:
      abi: ICampaign
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - CampaignContribution
        - CampaignFundsClaimed
      abis:
        - name: ICampaign
          file: ./abis/ICampaign.json
      eventHandlers:
        - event: CampaignContribution(indexed address,uint256)
          handler: handleContribution
        - event: CampaignFundsClaimed(indexed address,uint256)
          handler: handleFundsClaimed
      file: ./src/campaign-mapping.ts